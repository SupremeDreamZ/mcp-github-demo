name: Deploy PowrHouse to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Verify PowrHouse publish directory
        run: |
          test -f ./powrhouse-exact-live/index.html
          for i in 01 02 03 04 05 06 07 08 09 10 11 12 13 14 15 16; do
            test -s "./powrhouse-exact-live/payload/${i}.b64"
          done
          find ./powrhouse-exact-live -maxdepth 2 -type f -print

      - name: Upload PowrHouse site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./powrhouse-exact-live

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
