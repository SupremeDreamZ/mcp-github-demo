name: Deploy PowrHouse to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Verify PowrHouse publish directory
        run: |
          test -f ./powrhouse-live/index.html
          test -f ./powrhouse-live/payload/ref-v5/01.b64
          test -f ./powrhouse-live/payload/ref-v5/02.b64
          find ./powrhouse-live -maxdepth 3 -type f -print

      - name: Upload PowrHouse site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./powrhouse-live

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
