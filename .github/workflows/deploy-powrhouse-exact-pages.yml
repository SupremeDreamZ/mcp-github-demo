name: Deploy Reference-Locked PowrHouse Site

on:
  push:
    branches:
      - main
    paths:
      - "powrhouse-exact-live/**"
      - ".github/workflows/deploy-powrhouse-exact-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload reference-locked site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./powrhouse-exact-live
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
