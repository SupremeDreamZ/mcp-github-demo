<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050607">
<title>PowrHouse — Loading Experience</title>
<style>
html,body{height:100%;margin:0;background:#050607;color:#e8f7db;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}body{display:grid;place-items:center;overflow:hidden}main{width:min(86vw,560px)}.brand{font:900 clamp(2rem,8vw,4.5rem)/.9 Impact,Haettenschweiler,'Arial Narrow Bold',sans-serif;font-style:italic}.brand span{color:#a8ff00}p{margin:1.25rem 0 .75rem;color:#a7b1a2;letter-spacing:.08em;font-size:.78rem}.track{height:6px;background:#1c2419;overflow:hidden;border:1px solid #34402e}.bar{height:100%;width:0;background:#a8ff00;box-shadow:0 0 18px #a8ff00;transition:width .18s ease}.error{color:#ff5d5d;white-space:pre-wrap;line-height:1.5}a{color:#a8ff00}
</style>
</head>
<body><main><div class="brand">Powr<span>House.</span></div><p id="status">ASSEMBLING CULTIVATION SYSTEM · 0%</p><div class="track"><div id="bar" class="bar"></div></div><pre id="error" class="error" hidden></pre></main>
<script>
(async()=>{
const files=["./payload/01.b64", "./payload/02.b64", "./payload/03.b64", "./payload/04.b64"];
const compressedHash='466efb5117c2e01dec69edc26b0883275106a539c52c32e5af811d32de8225aa',htmlHash='66840bc2adca4f91836f4db1323e3a865d66be70636011501bd4e4a47802ec7d';
const status=document.getElementById('status'),bar=document.getElementById('bar'),errorBox=document.getElementById('error');
const hex=buffer=>[...new Uint8Array(buffer)].map(v=>v.toString(16).padStart(2,'0')).join('');
try{
 if(typeof DecompressionStream==='undefined') throw new Error('This browser does not support the required gzip decoder. Use a current Safari, Chrome, Edge, or Firefox release.');
 let encoded='';
 for(let i=0;i<files.length;i++){const response=await fetch(files[i],{cache:'no-store'});if(!response.ok)throw new Error(`Payload ${i+1} failed: HTTP ${response.status}`);encoded+=(await response.text()).trim();const pct=Math.round(((i+1)/files.length)*70);status.textContent=`ASSEMBLING CULTIVATION SYSTEM · ${pct}%`;bar.style.width=`${pct}%`;}
 const raw=atob(encoded),bytes=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);
 const actualCompressed=hex(await crypto.subtle.digest('SHA-256',bytes));if(actualCompressed!==compressedHash)throw new Error(`Compressed payload integrity mismatch. Expected ${compressedHash}, received ${actualCompressed}.`);
 status.textContent='DECOMPRESSING EXPERIENCE · 82%';bar.style.width='82%';
 const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();
 const actualHtml=hex(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(html)));if(actualHtml!==htmlHash)throw new Error(`Decoded site integrity mismatch. Expected ${htmlHash}, received ${actualHtml}.`);
 status.textContent='SYSTEM VERIFIED · 100%';bar.style.width='100%';document.open();document.write(html);document.close();
}catch(error){status.textContent='LOAD FAILURE';errorBox.hidden=false;errorBox.textContent=error.message+'\n\nReload once. GitHub CDN caches can briefly serve an incomplete commit immediately after publishing.';}
})();
</script></body></html>
