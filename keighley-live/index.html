<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0a0a0a"><title>The Keighley</title><style>html,body{margin:0;width:100%;height:100%;background:#0a0a0a;color:#f4f1ea;font-family:Inter,system-ui,-apple-system,sans-serif}body{display:grid;place-items:center;overflow:hidden}.loader{display:grid;gap:18px;text-align:center}.mark{width:52px;height:52px;margin:auto;border:1px solid rgba(244,241,234,.2);border-top-color:#e8a33d;border-radius:50%;animation:spin 1s linear infinite}.label{font:700 10px/1.3 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.22em;text-transform:uppercase;color:#d8d3c9}.error{max-width:520px;padding:24px;line-height:1.5}@keyframes spin{to{transform:rotate(360deg)}}</style></head><body><div class="loader"><div class="mark"></div><div class="label">Loading The Keighley</div></div><script type="module">try{const files=['b1.txt','b2.txt','b3.txt','b4.txt'];const parts=await Promise.all(files.map(async file=>{const response=await fetch(file,{cache:'no-store'});if(!response.ok)throw new Error(`${file}: ${response.status}`);return response.text()}));const binary=Uint8Array.from(atob(parts.join('')),character=>character.charCodeAt(0));if(!('DecompressionStream'in window))throw new Error('This browser does not support gzip decompression.');const stream=new Blob([binary]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();document.open();document.write(html);document.close()}catch(error){console.error(error);document.body.innerHTML=`<div class="error"><strong>The preview failed to unpack.</strong><br><br>${String(error.message||error)}</div>`}</script></body></html>
