<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0a0a0a"><title>The Keighley — Fixed Preview</title><style>html,body{margin:0;width:100%;height:100%;background:#0a0a0a;color:#f4f1ea;font-family:system-ui,-apple-system,sans-serif}body{display:grid;place-items:center;overflow:hidden}.loader{text-align:center;font:700 10px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.2em;text-transform:uppercase}.spinner{width:48px;height:48px;margin:0 auto 16px;border:1px solid #333;border-top-color:#e8a33d;border-radius:50%;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}pre{max-width:min(680px,90vw);white-space:pre-wrap;line-height:1.5}</style></head><body><div class="loader"><div class="spinner"></div>Loading corrected camera</div><script type="module">try{const base='../keighley-live/';const names=['b1.txt','b2.txt','b3.txt','b4.txt'];const payload=[];for(const name of names){const response=await fetch(base+name,{cache:'no-store'});if(!response.ok)throw new Error(name+': '+response.status);payload.push(await response.text())}const patchResponse=await fetch('patch.json',{cache:'no-store'});if(!patchResponse.ok)throw new Error('patch.json: '+patchResponse.status);const operations=await patchResponse.json();const bytes=Uint8Array.from(atob(payload.join('')),character=>character.charCodeAt(0));if(!('DecompressionStream' in window))throw new Error('This browser cannot unpack the site payload.');const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));let html=await new Response(stream).text();for(let index=operations.length-1;index>=0;index--){const [start,end,replacement]=operations[index];html=html.slice(0,start)+replacement+html.slice(end)}if(html.length!==54362||!html.startsWith('<!doctype html>'))throw new Error('Corrected source failed verification.');document.open();document.write(html);document.close()}catch(error){console.error(error);document.body.innerHTML=`<pre>Preview error: ${String(error.message||error)}</pre>`}</script></body></html>
