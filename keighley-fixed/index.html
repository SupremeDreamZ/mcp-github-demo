<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0a0a0a"><title>The Keighley — Fixed</title><style>html,body{margin:0;width:100%;height:100%;background:#0a0a0a;color:#f4f1ea;font-family:system-ui}body{display:grid;place-items:center}.l{text-align:center;font:700 10px ui-monospace;letter-spacing:.2em;text-transform:uppercase}.s{width:48px;height:48px;margin:0 auto 16px;border:1px solid #333;border-top-color:#e8a33d;border-radius:50%;animation:r 1s linear infinite}@keyframes r{to{transform:rotate(360deg)}}</style></head><body><div class="l"><div class="s"></div>Loading corrected camera</div><script type="module">try{const unzip=async text=>{const bytes=Uint8Array.from(atob(text),c=>c.charCodeAt(0));return new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text()};const base='../keighley-live/';const [payload,patchText]=await Promise.all([Promise.all(['b1.txt','b2.txt','b3.txt','b4.txt'].map(async n=>{const r=await fetch(base+n,{cache:'no-store'});if(!r.ok)throw Error(n+': '+r.status);return r.text()})),fetch('patch.txt',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('patch: '+r.status);return r.text()})]);let fixed=await unzip(payload.join(''));const replacements=JSON.parse(await unzip(patchText));for(const [a,b] of replacements){if(!fixed.includes(a))throw Error('Patch target missing: '+a.slice(0,60));fixed=fixed.split(a).join(b)}document.open();document.write(fixed);document.close()}catch(e){console.error(e);document.body.innerHTML='<pre style="padding:24px;white-space:pre-wrap">Preview error: '+String(e.message||e)+'</pre>'}</script></body></html>
